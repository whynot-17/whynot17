<rect x="130" y="1132" width="2115" height="155" rx="18" fill="#F4F7F7"/>
<text x="175" y="1186" text-anchor="start" font-size="29" font-weight="700" fill="#18303B">观察复发率绝对差：+13.4 个百分点</text>
<text x="1260" y="1186" text-anchor="start" font-size="29" font-weight="700" fill="#18303B">平均 OOB 风险绝对差：+11.9 个百分点</text>
<text x="175" y="1232" text-anchor="start" font-size="22" font-weight="400" fill="#5E7078">解释为预测分层与既往 ctDNA 阳性史有关；不是治疗效应或因果效应。</text>
<text x="175" y="1270" text-anchor="start" font-size="20" font-weight="400" fill="#5E7078">“未观察到阳性”仅描述可用采样史，不能证明未采样时段真实阴性；组间差异未作独立验证队列推断。</text>
