<text x="105" y="102" text-anchor="start" font-size="50" font-weight="700" fill="#18303B">分子记忆：当前 L6 阴性，不代表风险相同</text>
<text x="108" y="149" text-anchor="start" font-size="27" font-weight="400" fill="#5E7078">GALAXY 开发队列｜两组当前均为 ctDNA 阴性；按 L6 前是否曾观察到阳性分层</text>
