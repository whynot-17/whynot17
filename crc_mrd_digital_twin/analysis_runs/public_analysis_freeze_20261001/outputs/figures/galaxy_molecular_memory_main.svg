<text x="120" y="269" text-anchor="start" font-size="39" font-weight="700" fill="#16836B">+ → −  ≠  − → −</text>
<text x="560" y="274" text-anchor="start" font-size="27" font-weight="700" fill="#18303B">既往阳性、现已转阴者，L6 后至 12 月的复发率仍较高</text>
